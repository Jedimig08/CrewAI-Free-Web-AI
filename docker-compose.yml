name: crewai-free-web-ai

services:
  browser:
    build:
      context: ../free-web-ai/browser
      dockerfile: Dockerfile
    image: free-web-ai-browser
    container_name: free-web-ai-browser
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Lisbon}
      CUSTOM_USER: ${BROWSER_USER:-admin}
      PASSWORD: ${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in .env}
      CHROME_CLI: >-
        --remote-debugging-address=0.0.0.0
        --remote-debugging-port=9222
        --remote-allow-origins=*
    ports:
      - "${BROWSER_GUI_HOST_PORT:-6081}:3001"
      - "${GATEWAY_HOST_PORT:-3457}:3456"
    expose:
      - "9222"
    volumes:
      - browser-data:/config
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - free-web-ai-net

  gateway:
    build:
      context: ../free-web-ai
      dockerfile: Dockerfile
    image: free-web-ai-gateway
    container_name: free-web-ai-gateway
    restart: unless-stopped
    init: true
    environment:
      HOME: /config
      TFG_PORT: "3456"
      TFG_CDP_URL: "http://127.0.0.1:9222"
      TFG_API_KEY: ${TFG_API_KEY:?Set TFG_API_KEY in .env}
      TFG_CHUNK_CHARS: ${TFG_CHUNK_CHARS:-24000}
      TFG_REQUEST_TIMEOUT_SEC: ${TFG_REQUEST_TIMEOUT_SEC:-300}
    volumes:
      - gateway-data:/config
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3456/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: "service:browser"

  crewai:
    build:
      context: ./crewai
      dockerfile: Dockerfile
    image: crewai-free-web-ai
    container_name: crewai-api
    restart: unless-stopped
    init: true
    environment:
      TFG_BASE_URL: http://browser:3456/v1
      TFG_API_KEY: ${TFG_API_KEY:?Set TFG_API_KEY in .env}
      OPENAI_API_KEY: ${TFG_API_KEY:?Set TFG_API_KEY in .env}
      OPENAI_BASE_URL: http://browser:3456/v1
      OPENAI_API_BASE: http://browser:3456/v1
      CREWAI_API_KEY: ${CREWAI_API_KEY:?Set CREWAI_API_KEY in .env}
      CREWAI_MODEL: ${CREWAI_MODEL:-chatgpt-auto}
      CREWAI_MAX_EXECUTION_SEC: ${CREWAI_MAX_EXECUTION_SEC:-300}
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_OPT_OUT: "true"
      EXPLAIN_OUTPUT_DIR: /app/explanations
      EXPLAIN_MAX_FILES: ${EXPLAIN_MAX_FILES:-150}
      EXPLAIN_MAX_FILE_BYTES: ${EXPLAIN_MAX_FILE_BYTES:-200000}
      EXPLAIN_CHUNK_LINES: ${EXPLAIN_CHUNK_LINES:-120}
      EXPLAIN_CHUNK_OVERLAP: ${EXPLAIN_CHUNK_OVERLAP:-10}
      EXPLAIN_MAX_CHUNKS: ${EXPLAIN_MAX_CHUNKS:-200}
      EXPLAIN_MAX_WORKERS: ${EXPLAIN_MAX_WORKERS:-4}
      EXPLAIN_MAX_TOTAL_WORKERS: ${EXPLAIN_MAX_TOTAL_WORKERS:-8}
      EXPLAIN_JOB_TIMEOUT_SEC: ${EXPLAIN_JOB_TIMEOUT_SEC:-1800}
      EXPLAIN_CLONE_TIMEOUT_SEC: ${EXPLAIN_CLONE_TIMEOUT_SEC:-60}
      EXPLAIN_REFINE: ${EXPLAIN_REFINE:-true}
      EXPLAIN_MAX_REFINE_ROUNDS: ${EXPLAIN_MAX_REFINE_ROUNDS:-1}
      EXPLAIN_LIVE_EVERY: ${EXPLAIN_LIVE_EVERY:-1}
      EXPLAIN_ALLOW_LOCAL: ${EXPLAIN_ALLOW_LOCAL:-false}
      EXPLAIN_ALLOWED_HOSTS: ${EXPLAIN_ALLOWED_HOSTS:-}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./explained-outputs:/app/explanations
    ports:
      - "${CREWAI_HOST_BIND:-127.0.0.1}:${CREWAI_HOST_PORT:-8000}:8000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - free-web-ai-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: crewai-web
    container_name: crewai-web
    restart: unless-stopped
    environment:
      CREWAI_API_KEY: ${CREWAI_API_KEY:?Set CREWAI_API_KEY in .env}
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:80"
    depends_on:
      crewai:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - free-web-ai-net

networks:
  free-web-ai-net:
    name: free-web-ai_free-web-ai-net
    driver: bridge

volumes:
  gateway-data:
    name: free-web-ai_gateway-data
  browser-data:
    name: free-web-ai_browser-data
